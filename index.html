<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame Exporter</title>
    <meta name="color-scheme" content="dark" />
    <script>
      // Early hook so Tauri smoke injection is observable even before React mounts.
      window.__FRAME_EXPORTER_SMOKE_SEEN__ = 0;
      window.addEventListener('frame-exporter-smoke', function () {
        window.__FRAME_EXPORTER_SMOKE_SEEN__ = (window.__FRAME_EXPORTER_SMOKE_SEEN__ || 0) + 1;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
